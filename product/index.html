<!DOCTYPE html>

<head>

    <style>
        :root {
            --bg: #f4efe6;
            --panel: rgba(255, 252, 246, 0.86);
            --panel-strong: rgba(255, 252, 246, 0.96);
            --line: rgba(17, 34, 41, 0.08);
            --text: #132127;
            --muted: rgba(19, 33, 39, 0.72);
            --muted-soft: rgba(19, 33, 39, 0.5);
            --shadow: 0 24px 60px rgba(31, 44, 51, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Noto Sans SC', 'Manrope', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.7), transparent 28%),
                linear-gradient(180deg, #fbf7ef 0%, #f4efe6 100%);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            min-height: 100dvh;
        }

        .shell {
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
            padding: 28px 0 44px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }

        .topbar-note {
            color: var(--muted-soft);
            font-size: 13px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .hero-card,
        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
        }

        .hero-card {
            padding: 28px;
        }

        .eyebrow {
            display: inline-flex;
            padding: 9px 14px;
            border-radius: 999px;
            background: rgba(19, 33, 39, 0.05);
            border: 1px solid rgba(19, 33, 39, 0.08);
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .app-head {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 18px;
            align-items: center;
            margin-top: 20px;
        }

        .app-icon {
            width: 92px;
            height: 92px;
            border-radius: 22px;
            display: grid;
            place-items: center;
            color: #fffef9;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.04em;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        .app-title {
            margin: 0;
            font-family: 'Manrope', 'Noto Sans SC', sans-serif;
            font-size: clamp(30px, 4vw, 56px);
            line-height: 0.95;
            letter-spacing: -0.05em;
        }

        .app-subtitle {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.65;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }

        .tag {
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(19, 33, 39, 0.05);
            color: var(--muted);
            font-size: 13px;
            border: 1px solid rgba(19, 33, 39, 0.08);
        }

        .content-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 22px;
            margin-top: 22px;
        }

        .stack {
            display: grid;
            gap: 22px;
        }

        .panel {
            padding: 22px;
        }

        .panel-title {
            margin: 0 0 14px;
            font-family: 'Manrope', 'Noto Sans SC', sans-serif;
            font-size: 28px;
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .panel-copy,
        .copy-block p {
            margin: 0 0 14px;
            color: var(--muted);
            line-height: 1.85;
            font-size: 15px;
        }

        .shot-strip {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(280px, 1fr);
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 4px;
            justify-content: start;
            justify-items: start;
            align-items: start;
        }

        .shot {
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid rgba(19, 33, 39, 0.08);
            background: rgba(255, 255, 255, 0.52);
        }

        .shot img {
            width: 100%;
            aspect-ratio: 16 / 10;
            display: block;
            object-fit: cover;
            object-position: left top;
        }

        .embed-mode .shell {
            width: min(100%, calc(100% - 24px));
            padding-top: 12px;
            padding-bottom: 18px;
        }

        .embed-mode .topbar {
            display: none;
        }

        .embed-mode .hero-card,
        .embed-mode .panel {
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(31, 44, 51, 0.08);
        }

        [dir="rtl"] .topbar,
        [dir="rtl"] .hero-card,
        [dir="rtl"] .panel {
            text-align: right;
        }

        @media (max-width: 720px) {
            .shell {
                width: min(100%, calc(100% - 24px));
                padding-top: 16px;
            }

            .hero-card,
            .panel {
                padding: 18px;
            }

            .app-head {
                grid-template-columns: 1fr;
                align-items: flex-start;
            }

            .shot-strip {
                grid-auto-columns: 88%;
            }
        }
    </style>
</head>

        function getQueryValue(key) {
            const params = new URLSearchParams(window.location.search);
            return params.get(key);
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function resolveLang() {
            const lang = (getQueryValue('lang') || localStorage.getItem('site_language') || 'en').toLowerCase();
            return ['en', 'zh', 'ar'].includes(lang) ? lang : 'en';
        }

        function getLocalizedTag(tag, lang) {
            if (lang === 'en') return tag;
            return tagTranslations[tag]?.[lang] || tag;
        }

        function renderProduct(product, lang) {
            const ui = pageUi[lang] || pageUi.en;
            const locale = product.locales?.[lang] || product.locales?.en || {};

            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.body.setAttribute('dir', document.documentElement.dir);
            document.title = `${product.name} | Anton Oilfield DMCC`;

            document.getElementById('back-link').textContent = lang === 'ar' ? `${ui.back} →` : `← ${ui.back}`;
            document.getElementById('back-link').setAttribute('href', `../index.html?lang=${encodeURIComponent(lang)}#systems`);
            document.getElementById('topbar-note').textContent = ui.note;
            document.getElementById('eyebrow').textContent = locale.eyebrow || ui.defaultEyebrow;
            document.getElementById('app-icon').textContent = product.icon;
            document.getElementById('app-icon').style.background = `linear-gradient(135deg, ${product.accentA}, ${product.accentB})`;
            document.getElementById('app-title').textContent = product.name;
            document.getElementById('app-subtitle').textContent = locale.subtitle || '';
            document.getElementById('screenshots-title').textContent = ui.screenshots;
            document.getElementById('overview-title').textContent = ui.overview;

            document.getElementById('tag-row').innerHTML = (product.tags || []).map((tag) => `
                <span class="tag">${escapeHtml(getLocalizedTag(tag, lang))}</span>
            `).join('');

            document.getElementById('overview-copy').innerHTML = (locale.overview || []).map((paragraph) => `
                <p>${escapeHtml(paragraph)}</p>
            `).join('');

            document.getElementById('shot-strip').innerHTML = (product.screenshots || []).map((src, index) => `
                <div class="shot">
                    <img src="${escapeHtml(src)}" alt="${escapeHtml(product.name)} screenshot ${index + 1}">
                </div>
            `).join('');
        }

        const productId = (getQueryValue('id') || 'vgis').toLowerCase();
        const lang = resolveLang();
        const embedMode = getQueryValue('embed') === '1';
        const product = productCatalog[productId] || productCatalog.vgis;

        if (embedMode) {
            document.body.classList.add('embed-mode');
        }

        renderProduct(product, lang);
    </script>
