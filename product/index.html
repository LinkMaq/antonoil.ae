        const themeOrder = ['system', 'light', 'dark'];

        function getStoredTheme() {
            return localStorage.getItem('theme') || 'system';
        }

        function getResolvedTheme(theme) {
            if (theme === 'system') {
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            return theme;
        }

        function applyTheme(theme) {
            const resolvedTheme = getResolvedTheme(theme);
            document.documentElement.classList.toggle('dark', resolvedTheme === 'dark');
        }

        function updateThemeButton(lang) {
            const ui = pageUi[lang] || pageUi.en;
            const theme = getStoredTheme();
            const labels = {
                light: ui.themeLight,
                dark: ui.themeDark,
                system: ui.themeSystem
            };
            const button = document.getElementById('theme-toggle');
            button.textContent = labels[theme];
            button.dataset.theme = theme;
            button.setAttribute('title', labels[theme]);
            button.setAttribute('aria-label', labels[theme]);
        }

        function cycleTheme(lang) {
            const currentTheme = getStoredTheme();
            const nextTheme = themeOrder[(themeOrder.indexOf(currentTheme) + 1) % themeOrder.length];
            if (nextTheme === 'system') {
                localStorage.removeItem('theme');
            } else {
                localStorage.setItem('theme', nextTheme);
            }
            applyTheme(nextTheme);
            updateThemeButton(lang);
        }

        function getQueryValue(key) {
            const params = new URLSearchParams(window.location.search);
            return params.get(key);
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function resolveLang() {
            const lang = (getQueryValue('lang') || localStorage.getItem('site_language') || 'en').toLowerCase();
            return ['en', 'zh', 'ar'].includes(lang) ? lang : 'en';
        }

        function getLocalizedTag(tag, lang) {
            if (lang === 'en') return tag;
            return tagTranslations[tag]?.[lang] || tag;
        }

        function updateMetaTag(selector, attribute, value) {
            const element = document.querySelector(selector);
            if (element && typeof value !== 'undefined') {
                element.setAttribute(attribute, value);
            }
        }

        function hexToRgbString(hex) {
            const normalized = hex.replace('#', '');
            const value = normalized.length === 3
                ? normalized.split('').map((char) => char + char).join('')
                : normalized;
            const channel = (index) => Number.parseInt(value.slice(index, index + 2), 16);
            return `${channel(0)}, ${channel(2)}, ${channel(4)}`;
        }

        function updateProductSeo(product, locale, lang) {
            const description = locale.subtitle || pageUi[lang]?.defaultEyebrow || pageUi.en.defaultEyebrow;
            const canonicalUrl = new URL('/product/index.html', SITE_ORIGIN);
            canonicalUrl.searchParams.set('id', product.id);
            if (lang !== 'en') {
                canonicalUrl.searchParams.set('lang', lang);
            }
            const imageUrl = product.screenshots?.[0]
                ? new URL(product.screenshots[0].replace(/^\.\.\//, ''), `${SITE_ORIGIN}/`).toString()
                : `${SITE_ORIGIN}/assets/hero/strategy-middle-east.webp`;
            const pageTitle = `${product.name} | Anton Oilfield DMCC`;

            document.title = pageTitle;
            updateMetaTag('meta[name="description"]', 'content', description);
            updateMetaTag('meta[property="og:title"]', 'content', pageTitle);
            updateMetaTag('meta[property="og:description"]', 'content', description);
            updateMetaTag('meta[property="og:url"]', 'content', canonicalUrl.toString());
            updateMetaTag('meta[property="og:image"]', 'content', imageUrl);
            updateMetaTag('meta[property="og:image:alt"]', 'content', `${product.name} product preview`);
            updateMetaTag('meta[name="twitter:title"]', 'content', pageTitle);
            updateMetaTag('meta[name="twitter:description"]', 'content', description);
            updateMetaTag('meta[name="twitter:image"]', 'content', imageUrl);
            updateMetaTag('link[rel="canonical"]', 'href', canonicalUrl.toString());

            const productJsonLd = document.getElementById('structured-data-product');
            if (productJsonLd) {
                productJsonLd.textContent = JSON.stringify({
                    '@context': 'https://schema.org',
                    '@type': 'SoftwareApplication',
                    name: product.name,
                    applicationCategory: 'BusinessApplication',
                    operatingSystem: 'Web',
                    url: canonicalUrl.toString(),
                    description,
                    image: imageUrl,
                    inLanguage: lang === 'zh' ? 'zh-CN' : lang,
                    creator: {
                        '@type': 'Organization',
                        name: 'Anton Oilfield DMCC',
                        url: `${SITE_ORIGIN}/`
                    }
                });
            }
        }

        function renderProduct(product, lang) {
            const ui = pageUi[lang] || pageUi.en;
            const locale = product.locales?.[lang] || product.locales?.en || {};

            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.body.setAttribute('dir', document.documentElement.dir);
            updateProductSeo(product, locale, lang);

            document.getElementById('back-link').textContent = lang === 'ar' ? `${ui.back} →` : `← ${ui.back}`;
            document.getElementById('back-link').setAttribute('href', `../index.html?lang=${encodeURIComponent(lang)}#systems`);
            document.getElementById('topbar-note').textContent = ui.note;
            document.getElementById('eyebrow').textContent = locale.eyebrow || ui.defaultEyebrow;
            document.documentElement.style.setProperty('--product-accent-a', product.accentA);
            document.documentElement.style.setProperty('--product-accent-b', product.accentB);
            document.documentElement.style.setProperty('--product-accent-a-rgb', hexToRgbString(product.accentA));
            document.documentElement.style.setProperty('--product-accent-b-rgb', hexToRgbString(product.accentB));
            document.getElementById('app-icon').textContent = product.icon;
            document.getElementById('app-icon').style.background = `linear-gradient(135deg, ${product.accentA}, ${product.accentB})`;
            document.getElementById('app-title').textContent = product.name;
            document.getElementById('app-subtitle').textContent = locale.subtitle || '';
            document.getElementById('screenshots-title').textContent = ui.screenshots;
            document.getElementById('overview-title').textContent = ui.overview;
            updateThemeButton(lang);

            const translatedTags = (product.tags || []).map((tag) => getLocalizedTag(tag, lang));

            document.getElementById('tag-row').innerHTML = translatedTags.map((tag) => `
                <span class="tag">${escapeHtml(tag)}</span>
            `).join('');

            document.getElementById('overview-copy').innerHTML = (locale.overview || []).map((paragraph) => `
                <p>${escapeHtml(paragraph)}</p>
            `).join('');

            document.getElementById('shot-strip').innerHTML = (product.screenshots || []).map((src, index) => `
                <div class="shot">
                    <img src="${escapeHtml(src)}" alt="${escapeHtml(product.name)} screenshot ${index + 1}">
                </div>
            `).join('');

            if (embedMode && window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'product-embed-meta',
                    embedUrl: window.location.pathname + window.location.search,
                    id: product.id,
                    name: product.name,
                    icon: product.icon,
                    eyebrow: locale.eyebrow || ui.defaultEyebrow,
                    subtitle: locale.subtitle || '',
                    tags: translatedTags
                }, '*');
            }
        }

        const productId = (getQueryValue('id') || 'vgis').toLowerCase();
        const lang = resolveLang();
        const embedMode = getQueryValue('embed') === '1';
        const product = productCatalog[productId] || productCatalog.vgis;

        if (embedMode) {
            document.body.classList.add('embed-mode');
        }

        applyTheme(getStoredTheme());
        document.getElementById('theme-toggle').addEventListener('click', () => cycleTheme(lang));
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (getStoredTheme() === 'system') {
                applyTheme('system');
            }
        });

        renderProduct(product, lang);
    </script>
</body>
</html>
