name: Build And Push Docker Image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY }}
  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  IMAGE_NAME: iof-portal

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate registry configuration
        run: |
          test -n "${REGISTRY}" || { echo "REGISTRY is not set"; exit 1; }
          test -n "${REGISTRY_USERNAME}" || { echo "REGISTRY_USERNAME is not set"; exit 1; }
          test -n "${REGISTRY_PASSWORD}" || { echo "REGISTRY_PASSWORD is not set"; exit 1; }

      - name: Extract image tag
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

      - name: Show published image
        run: echo "Published ${{ steps.meta.outputs.image }}"
